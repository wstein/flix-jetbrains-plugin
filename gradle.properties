group = dev.wstein.flixplugin
version = 0.1.0

# Upstream Flix revision that the adopted Grammar-Kit/JFlex grammar is derived from and
# validated against. Used by the parser corpus evaluation; see NOTICE and
# docs/intellij-flix-parser-evaluation.md. Must be a commit reachable from flix/flix
# origin/master so the gate is reproducible outside this machine.
flixCorpusCommit = cc7c54950c4de214aa5777fd23ba53a59781c608

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
