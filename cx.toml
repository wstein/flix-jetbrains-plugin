#:schema https://wstein.github.io/cx-cli/schemas/cx-config-v1.schema.json
# cx works in three cooperating paths:
#   proof:     bundle, extract, list, validate, verify
#   live:      mcp
#   adapter:   adapter, render
# See: cx --help.
schema_version = 1
project_name = "flix-jetbrains-plugin"
source_root = "."
output_dir = "~/Downloads/flix-jetbrains-plugin-bundle"

[output.extensions]
xml = ".xml.txt"
json = ".json.txt"
markdown = ".md"
plain = ".txt"

[repomix]
style = "xml"
show_line_numbers = false
include_empty_directories = false
security_check = true

[files]
# [files].include extends the master candidate list beyond VCS-tracked files.
# Keep it empty: Git is the source of truth for this plugin.
include = []
# Never pack build products, Gradle/IDE state, or bundled dependencies. The
# grammar and all hand-written source remain eligible; Grammar-Kit output lives
# under language/build and is intentionally regenerated by Gradle.
exclude = [
  ".git/**",
  ".gradle/**",
  ".idea/**",
  ".intellijPlatform/**",
  ".qodana/**/results/**",
  "**/build/**",
  "**/out/**",
  "dist/**",
  "tmp/**",
  "node_modules/**",
  "vendor/**",
  "third_party/**",
  "gradle/wrapper/**",
  "gradlew",
  "gradlew.bat",
  "**/*.class",
  "**/*.jar",
]
follow_symlinks = false
unmatched = "ignore"

[dedup]
# mode = "fail" aborts bundling if any file matches multiple section globs.
# This guarantees deterministic ownership in the manifest.
# Override locally with: cx --lenient bundle
# Or scope per-section by tightening section globs.
# Docs: README.md
mode = "fail"
order = "config"
require_explicit_ownership = true

[manifest]
format = "json"
pretty = true
include_file_sha256 = true
include_output_sha256 = true
include_output_spans = true
include_source_metadata = true

# Set pretty = false to produce compact single-line manifests (smaller files, CI-friendly).

[handover]
include_repo_history = true
repo_history_count = 25

[mcp]
# The MCP server is the live workspace path: agents read live state and may
# mutate files only when explicitly authorized. policy="default" keeps mutation
# bounded; use "unrestricted" only for trusted local sessions.
policy = "default"
# policy = "unrestricted"
audit_logging = true
enable_mutation = true

[scanner]
mode = "warn"
ids = ["reference_secrets"]
include_post_pack_artifacts = false

[checksums]
algorithm = "sha256"
file_name = "{project}.sha256"

[tokens]
encoding = "o200k_base"

[assets]
# Keep icons beside their module sources; a separate asset bundle would create
# duplicate ownership and provide no additional review context.
include = []
exclude = []
mode = "copy"
target_dir = "assets"
layout = "flat"

# Keep sections coarse. They are intentionally sized to grow toward 200k--800k
# tokens each; the whole repository is still below that lower bound today.
# Every section owns production sources, descriptors, and its colocated tests so
# a review has the implementation and its evidence in one context.

[sections.language_and_editor]
# Adopted first-party language layer: grammar, PSI, highlighting, editor UX,
# entry-point discovery, and the split-mode frontend descriptor.
include = ["language/**", "frontend/**"]

[sections.native_debug_and_execution]
# Native JVM source mapping, stepping, run/debug configuration, launch helpers,
# backend LSP integration, and all corresponding tests.
include = ["debugger/**", "shared/**", "backend/**"]

[sections.architecture_build_and_verification]
# Plugin assembly, Gradle convention/wiring, integration manifest, CI, IDE run
# profiles, project instructions, and the decision/gate documentation.
include = [
  "src/**",
  "build.gradle.kts",
  "settings.gradle.kts",
  "gradle.properties",
  "gradle/**",
  "buildSrc/**",
  "flix-integration.yaml",
  "docs/**",
  ".github/**",
  ".qodana/**",
  "qodana.yml",
  ".run/**",
  "README.md",
  "CHANGELOG.md",
  "NOTICE",
  "LICENSE",
  ".gitignore",
  ".editorconfig",
  ".markdownlint.json",
  "Makefile",
  "cx.toml",
  "cx-mcp.toml",
  ".mcp.json",
  ".codex/**",
  ".claude/**",
]

# -- Audited overrides -------------------------------------------------
# cx never silently ignores a strict gate; it records the override.
#
#   cx --lenient bundle      # downgrade fail to warn for this run
#   cx bundle --force        # bundle a dirty tree; manifest records forced_dirty
#   cx bundle --ci           # same, marked ci_dirty for pipeline provenance
