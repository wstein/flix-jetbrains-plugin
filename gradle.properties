group = de.wstein.flixplugin
version = 0.2.0-beta.1

# Upstream Flix revision that the adopted Grammar-Kit/JFlex grammar is derived from and
# validated against. Used by the parser corpus evaluation; see NOTICE and
# docs/intellij-flix-parser-evaluation.md. Must be a commit reachable from flix/flix
# origin/master so the gate is reproducible outside this machine.
#
# It must also be the revision flix-spec is derived from, which is v0.75.1. Those are two
# independent pins on the same compiler, and FlixSpecConformanceTest compares them rather than
# trusting either: fixtures describing one Flix while the corpus gate reads another is the exact
# situation that test exists to catch, and it had caught it -- CI failed on every run from 3 August
# until this line moved. The corpus is 427 of 427 at both revisions, so aligning them cost nothing.
flixCorpusCommit = 318bb51a953c58a8785251a80fad8aea005f729f

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
