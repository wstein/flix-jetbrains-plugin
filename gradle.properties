group = de.wstein.flixplugin
version = 0.2.0-beta.1

# Upstream Flix revision that the adopted Grammar-Kit/JFlex grammar is derived from and
# validated against. Used by the parser corpus evaluation; see NOTICE and
# docs/intellij-flix-parser-evaluation.md. Must be a commit reachable from flix/flix
# origin/master so the gate is reproducible outside this machine.
#
# It must also be the revision flix-spec is derived from, which is v0.75.2 as of flix-spec 0.75.8.
# Those are two independent pins on the same compiler, and FlixSpecConformanceTest compares them
# rather than trusting either: fixtures describing one Flix while the corpus gate reads another is
# the exact situation that test exists to catch, and it has caught it twice -- from 3 August, and
# again when adopting flix-spec 0.75.8 moved the fixtures without moving this line. The second time
# the corpus gate failed too: v0.75.2 removed `law`, so did the grammar, and v0.75.1's corpus
# still uses it. Bump this together with `flixSpecVersion` in language/build.gradle.kts.
flixCorpusCommit = 40949531b4d42e5eaf2e4b9997537eaf793c24e7

# Upstream flixw revision whose cache and JDK rules FlixwProject transcribes. CI checks the
# implementation against this source so the contract cannot silently skip when no sibling flixw
# checkout happens to exist.
flixwCommit = 15bd2346d4a82e08edcc3de7f3deb27a53a16985

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
